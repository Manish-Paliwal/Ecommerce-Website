services:
  - type: web
    name: ecommerce-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://manish-paliwal.github.io
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
